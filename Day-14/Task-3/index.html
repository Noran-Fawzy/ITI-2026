<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Addition -->
        <div class="box addition">
            <h2>ADDITION</h2>
            <div class="content">
                <input type="number" id="add1">
                <span>+</span>
                <input type="number" id="add2">
                <span>=</span>
                <span id="addResult">0</span>
            </div>
        </div>

        <!-- Multiplication -->
        <div class="box multiplication">
            <h2>MULTIPLICATION</h2>
            <div class="content">
                <input type="number" id="mul1">
                <span>×</span>
                <input type="number" id="mul2">
                <span>=</span>
                <span id="mulResult">0</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
