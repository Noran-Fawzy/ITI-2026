<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-1</title>
    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<section class="locations">
    <h2>ITI Locations</h2>
    <p>ITI Main Locations all over the country</p>
    <div class="content">
        <div class="map">
            <img src="map.png" alt="Egypt Map">
        </div>
        <div class="branches">
            <div class="column">
                <div class="card active">
                    <i class="fa-solid fa-location-dot"></i>
                    ITI - Smart Village
                </div>
                <div class="card">
                    <i class="fa-solid fa-location-dot"></i>
                    ITI - Assiut
                </div>
                <div class="card">
                    <i class="fa-solid fa-location-dot"></i>
                    ITI - Ismailia
                </div>
                <div class="card">
                    <i class="fa-solid fa-location-dot"></i>
                    ITI - Menofia
                </div>
            </div>
            <div class="column">
                <div class="card">
                    <i class="fa-solid fa-location-dot"></i>
                    ITI - Alexandria
                </div>
                <div class="card">
                    <i class="fa-solid fa-location-dot"></i>
                    ITI - Aswan
                </div>
                <div class="card">
                    <i class="fa-solid fa-location-dot"></i>
                    ITI - Mansoura
                </div>
                <div class="card">
                    <i class="fa-solid fa-location-dot"></i>
                    ITI - Minya
                </div>
            </div>
        </div>
    </div>
    <div class="legend">
        <span><span class="brown"></span> Main Branch</span>
        <span><span class="black"></span> Branch</span>
    </div>
</section>
</body>
</html>
